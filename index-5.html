<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Walk to Lapland</title>
<meta name="description" content="Our group walk from Bedfordshire to Santa's home in Lapland, 1 November to 19 December.">
<meta name="theme-color" content="#2E5B4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: snowy header with fairy lights, steps first (one big box, one big button), then the map with our walker, then the doors wrapped as presents. Green, white, berry red and gold. */
:root{
  --green:#2E5B4C; --green-mid:#4E8170; --green-soft:#DCEBE3; --sea:#EAF3EE;
  --white:#FFFFFF; --page:#F6FAF8; --ink:#1B2924; --muted:#5D6E67; --line:#C9DACF;
  --red:#C8553D; --berry:#A8322A; --gold:#D9A441; --error:#A8321F;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.inner{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.band{position:relative;overflow:hidden;background:var(--green);color:var(--white);padding-top:env(safe-area-inset-top,0px)}
.snow{position:absolute;left:0;right:0;top:-240px;bottom:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.95) 1.6px,transparent 2.2px),radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1.6px);background-size:64px 64px,38px 38px;background-position:0 0,17px 21px;animation:snow 9s linear infinite}
@keyframes snow{to{background-position:0 128px,17px 97px}}
.lights{position:relative;z-index:1;max-width:600px;margin:0 auto;height:30px}
.lights svg{display:block;width:100%;height:30px}
.bulb{animation:twinkle 2.4s ease-in-out infinite}
.bulb:nth-of-type(3n){animation-delay:.8s}
.bulb:nth-of-type(3n+1){animation-delay:1.6s}
@keyframes twinkle{50%{opacity:.35}}
.hills{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;pointer-events:none}
.band .inner{position:relative;z-index:1;padding-block:6px 74px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.band h1{font-size:clamp(1.9rem,8vw,2.6rem)}
.band small{display:block;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.band .togo{text-align:right;font-size:.85rem;opacity:.9;line-height:1.3}
.band .togo b{display:block;font-family:var(--display);font-size:1.5rem;opacity:1}

main{display:flex;flex-direction:column;gap:22px;margin-top:-56px;padding-bottom:48px}
.card{background:var(--white);border-radius:22px;box-shadow:0 8px 28px rgba(27,41,36,.10);padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:1.5rem}

/* Logging */
.steps-box{display:flex;flex-direction:column;gap:10px}
.steps-box input{width:100%;font-family:var(--display);font-weight:700;font-size:2.6rem;text-align:center;font-variant-numeric:tabular-nums;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--page);color:var(--ink);-moz-appearance:textfield}
.steps-box input::-webkit-outer-spin-button,.steps-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.steps-box input:focus{outline:none;border-color:var(--green)}
.steps-box input::placeholder{color:#B5C6BD}
.btn{border:0;border-radius:16px;background:var(--green);color:var(--white);font-weight:700;font-size:1.15rem;padding:16px 20px;min-height:58px;cursor:pointer;width:100%}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.soft{background:var(--green-soft);color:var(--green)}
.btn:focus-visible,.link:focus-visible,.door:focus-visible,.stop:focus-visible,select:focus-visible,.steps-box input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.95rem}
.day-row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem;color:var(--muted)}
select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--page);color:var(--ink);max-width:100%}
.msg{text-align:center;font-size:.95rem;font-weight:600;min-height:1.4em}
.msg.err{color:var(--error)}
.win{background:var(--berry);color:var(--white);border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:4px;animation:pop .45s ease}
.win b{font-family:var(--display);font-size:1.8rem}
.win .link{color:var(--white);font-size:.9rem;margin-top:4px}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.today{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.today-top{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;flex-wrap:wrap}
.today-top b{font-variant-numeric:tabular-nums}
.mini{height:18px;border-radius:99px;background:var(--green-soft);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.mini span{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(-45deg,var(--berry) 0 9px,#FFFFFF 9px 18px);box-shadow:inset 0 0 0 1.5px var(--berry);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.group-day{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;background:var(--green-soft);border-radius:16px;padding:14px 16px}
.group-day>div{display:flex;flex-direction:column;gap:2px}
.group-day>div+div{text-align:right}
.gd-label{font-size:.85rem;font-weight:600;color:var(--green)}
.gd-num{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.gd-num.small{font-size:1.3rem;color:var(--muted)}
.left-num{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--berry)}
.note{font-size:.88rem;color:var(--muted)}
.note b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Map */
.where{display:flex;flex-direction:column;gap:4px}
.where .big{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15}
.where .big em{font-style:normal;color:var(--green)}
.mapbox{border-radius:16px;overflow:hidden;background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.c-label{font-family:var(--body);font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--white);stroke-width:3.5px;stroke-linejoin:round}
.c-label.dim{fill:var(--muted);font-weight:600}
.country{font-family:var(--display);font-style:italic;font-size:11px;fill:#9DB3A8}
.sea-l{font-family:var(--display);font-style:italic;font-size:10px;fill:#8FB3A2;letter-spacing:.06em}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-bar{position:relative;height:14px;border-radius:99px;background:var(--green-soft)}
.prog-bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:repeating-linear-gradient(-45deg,var(--green) 0 8px,#4E8170 8px 16px);transition:width .8s ease}
.prog-bar .tick{position:absolute;top:3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--white);border:2px solid var(--green-mid)}
.prog-bar .tick.on{background:var(--gold);border-color:var(--gold)}
.prog-ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}

.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stamp{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.95rem;border:2px dashed var(--line);color:var(--muted);background:var(--white)}
.stop.got .stamp{border:2px solid var(--gold);background:#FBF1DC;color:#8A6416;transform:rotate(-8deg)}
.stop.next .stamp{border:2px solid var(--green);color:var(--green)}
.stop-name{font-weight:700}
.stop-fact{font-size:.86rem;color:var(--muted)}
.stop-km{font-size:.85rem;font-weight:600;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stop.next .stop-km{color:var(--green)}
.stop.got .stop-km{color:#8A6416}

/* Doors */
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.doors{grid-template-columns:repeat(4,minmax(0,1fr))}}
.door{position:relative;text-align:left;border:0;border-radius:16px;padding:12px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:6px;cursor:pointer;color:var(--ink);transition:transform .15s ease;
  background-color:var(--green);
  background-image:linear-gradient(90deg,transparent calc(50% - 7px),var(--gold) calc(50% - 7px),var(--gold) calc(50% + 7px),transparent calc(50% + 7px)),linear-gradient(0deg,transparent calc(50% - 7px),var(--gold) calc(50% - 7px),var(--gold) calc(50% + 7px),transparent calc(50% + 7px))}
.door:nth-child(even){background-color:var(--berry)}
.door .num{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--white);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1;color:var(--green);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.door:nth-child(even) .num{color:var(--berry)}
.door .lbl{position:relative;z-index:1;font-size:.8rem;font-weight:700;background:var(--white);border-radius:99px;padding:4px 10px;color:var(--ink)}
.door .bow{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:46px;height:24px}
.door.new{box-shadow:0 0 0 3px var(--gold);animation:glow 1.8s ease-in-out infinite}
.door:hover:not(.locked){transform:translateY(-2px) rotate(-1deg)}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 0 0 9px rgba(217,164,65,.3)}}
.door.locked{cursor:default}
.door.locked .lbl{background:rgba(255,255,255,.88)}
.taps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.taps li b{color:var(--green)}

/* Door dialog */
dialog{border:0;padding:0;border-radius:24px;width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--white);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(27,41,36,.6)}
.dlg{display:flex;flex-direction:column}
.dlg-card{background:var(--green);color:var(--white);padding:26px 24px 24px;display:flex;flex-direction:column;gap:14px;position:relative}
.dlg-card .tag{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.dlg-card .verse{font-family:var(--display);font-style:italic;font-size:1.22rem;line-height:1.55;white-space:pre-line}
.dlg-card .ask{font-family:var(--display);font-weight:700;font-size:1.15rem}
.dlg-card .sig{font-size:.78rem;opacity:.75}
.x{position:absolute;top:14px;right:14px;border:0;background:rgba(255,255,255,.16);color:var(--white);width:38px;height:38px;border-radius:50%;font-size:1.3rem;line-height:1;cursor:pointer}
.dlg-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px}
.answer-tag{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.dlg-body h4{font-size:1.45rem;color:var(--green)}
.week{background:var(--green-soft);border-radius:14px;padding:14px;font-weight:600;color:var(--green)}
.pocket-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

.foot{text-align:center;font-size:.85rem;color:var(--muted)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.snow,.bulb{animation:none}.mini span{transition:none}.win,.door.new{animation:none}.prog-bar .fill{transition:none}.confetti{display:none}}
</style>
</head>

  for (var b=0;b<16;b++){ var bx=11+b*22.5, by=12; bulbs+='<g class="bulb"><rect x="'+(bx-2)+'" y="'+(by-3)+'" width="4" height="4" rx="1" fill="#1B2924"/><ellipse cx="'+bx+'" cy="'+(by+6)+'" rx="4.5" ry="6.5" fill="'+cols[b%4]+'"/></g>'; }

function dateOptions(){
  var t=todayIso(), last = t<END_ISO ? t : END_ISO, out=[], d=fromIso(last), first=fromIso(START_ISO);
  var y = iso(new Date(now().getFullYear(), now().getMonth(), now().getDate()-1));
  while (d>=first){ var v=iso(d); out.push({v:v, label: v===t?'Today':(v===y?'Yesterday':dayLabel(d))}); d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1); }
  return out;
}

function logHtml(km){
  var t = todayIso();
  if (t < START_ISO) return '<section class="card"><h2>We set off on Sunday!</h2><p class="note">Come back on <b>Sunday 1 November</b> to add your first steps. Every step you add moves the whole group closer to Santa.</p></section>';
  if (t > LOG_CLOSE_ISO) return '<section class="card"><h2>That’s a wrap</h2><p class="note">The walk is over. Thank you for every single step.</p></section>';
  var opts = dateOptions();
  if (!otherDay) selDate = opts[0] ? opts[0].v : t;
  var h = '<section class="card" aria-labelledby="log-h"><h2 id="log-h">'+(selDate===t?'Add today’s steps':'Add steps for '+dayLabel(fromIso(selDate)))+'</h2>';
  if (lastWin){
    h += '<div class="win" role="status"><span>Ho ho ho! Nice one!</span><b>+'+fmt(lastWin.steps)+' steps</b><span>You just moved us '+kmOf(lastWin.steps).toFixed(1)+' km closer to Santa.</span>'+

       '<button class="btn" id="log-btn"'+(busy?' disabled':'')+'>Add my steps</button></div>';

  h += '<div class="day-row">'+(otherDay ?

      'Forgot a day? <button class="link" id="other-day">Add it here</button>')+'</div>';

  h += '<div class="group-day"><div><span class="gd-label">Group steps today</span><span class="gd-num">'+(loaded?fmt(tGroup):'\u2026')+'</span></div>'+
       (yIso >= START_ISO ? '<div><span class="gd-label">Yesterday</span><span class="gd-num small">'+(loaded?fmt(yGroup):'\u2026')+'</span></div>' : '')+'</div>';
  h += '<div class="today"><div class="today-top"><span>Steps left to Lapland</span><span class="left-num">'+(loaded?fmt(leftSteps):'\u2026')+'</span></div>'+

       '<p class="note">'+(leftSteps>0 ? 'Every step you add makes this shrink.' : 'We did it. Santa\u2019s putting the kettle on.')+(mineLocal ? ' You\u2019ve added <b>'+fmt(mineLocal)+'</b> steps from this phone.' : '')+'</p></div>';
  if (loaded) prevLeftPct = leftPct;
  return h + '</section>';
}

function walkerAt(km){
  var k = Math.min(km, GOAL_KM);
  for (var i=1;i<STOPS.length;i++){
    var a=STOPS[i-1], b=STOPS[i];
    if (k <= b.km){ var f=(k-a.km)/(b.km-a.km); return {x:px(a.lon)+(px(b.lon)-px(a.lon))*f, y:py(a.lat)+(py(b.lat)-py(a.lat))*f, seg:i}; }
  }
  var l=STOPS[STOPS.length-1]; return {x:px(l.lon), y:py(l.lat), seg:STOPS.length};
}

  });
  [['UK',-2.4,54.2],['France',1.6,48.0],['Germany',11.0,51.3],['Norway',8.4,61.4],['Sweden',14.6,63.6],['Finland',27.2,62.8],['Poland',19.5,52.0]].forEach(function(c){

  // stops
  STOPS.forEach(function(p,i){

function mapHtml(km){

function wire(){
  var lb=document.getElementById('log-btn'), si=document.getElementById('steps-in');

    var go=function(){
      if (busy) return;
      var v=si.value.trim().replace(/[,\s]/g,'');
      if (!/^\d+$/.test(v) || +v<1){ setMsg('Pop your steps in as a number, like 7200.','err'); si.focus(); return; }
      if (+v>60000){ setMsg('That’s more than 60,000. Check the number and try again.','err'); return; }
      send(+v);
    };

  }

      '<p class="verse" id="dlg-title">'+d.verse+'</p><p class="ask">'+d.ask+'</p><p class="sig">Kelli Nutrition Coach</p></div>'+
      '<div class="dlg-body"><button class="btn" id="reveal">Reveal the answer</button>'+
      '<div id="answer" hidden style="display:flex;flex-direction:column;gap:12px"><span class="answer-tag">The answer</span><h4 tabindex="-1">'+d.answer+'</h4><p>'+d.recap+'</p>'+(d.taps ? '<ol class="taps">'+d.taps.map(function(t){ return '<li><b>'+t[0]+':</b> '+t[1]+'</li>'; }).join('')+'</ol>' : '')+'<div class="week">This week: '+d.week+'</div><button class="btn soft" data-close>Close</button></div></div>';
  }
  dlgBody.innerHTML=h;
  Array.prototype.forEach.call(dlgBody.querySelectorAll('[data-close]'), function(b){ b.addEventListener('click', function(){ dlg.close(); }); });
  var r=document.getElementById('reveal');
  if (r) r.addEventListener('click', function(){ r.hidden=true; var a=document.getElementById('answer'); a.hidden=false; a.querySelector('h4').focus(); });
  if (typeof dlg.showModal==='function') dlg.showModal(); else dlg.setAttribute('open','');
}
dlg.addEventListener('click', function(e){ if (e.target===dlg) dlg.close(); });
dlg.addEventListener('close', function(){ render(); });

function send(n){
  busy=true; setMsg('Adding your steps…'); var lb=document.getElementById('log-btn'); if (lb) lb.disabled=true;
  var before = stopIndexReached(kmOf(total));
  fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date:selDate,steps:n})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){
      busy=false;
      if (!res.ok){ msg={text:(res.j&&res.j.error)||'Couldn’t add your steps. Try again.',kind:'err'}; render(); return; }
      total+=n; days[selDate]=(days[selDate]||0)+n; mineLocal+=n; saveLocal();
      lastWin={steps:n,key:res.j.key,date:selDate}; msg={text:'',kind:''};
      var after = stopIndexReached(kmOf(total));
      if (after>before){ lastWin.city = STOPS[after].name; msg={text:'We’ve reached '+STOPS[after].name+'! Another stamp in the passport.',kind:''}; }
      render(); confetti();
    })
    .catch(function(){ busy=false; msg={text:'Couldn’t reach the server. Check your connection and try again.',kind:'err'}; render(); });
}

function undo(){
  if (!lastWin || !lastWin.key || busy) return;
  busy=true; var w=lastWin;
  fetch(API+'?key='+encodeURIComponent(w.key),{method:'DELETE'})
    .then(function(r){ if (!r.ok) throw new Error('bad'); })
    .then(function(){ busy=false; total-=w.steps; days[w.date]=Math.max(0,(days[w.date]||0)-w.steps); mineLocal=Math.max(0,mineLocal-w.steps); saveLocal(); lastWin=null; msg={text:'Undone. Pop the right number in.',kind:''}; render(); var s=document.getElementById('steps-in'); if (s) s.focus(); })
    .catch(function(){ busy=false; msg={text:'Couldn’t undo that. Try again.',kind:'err'}; render(); });
}

function load(){
  fetch(API,{cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('bad'); return r.json(); })
    .then(function(j){ total=+j.total||0; days=j.days||{}; loaded=true; loadError=false; if (!busy && !dlg.open) render(); })
    .catch(function(){ loadError=!loaded; if (!busy && !dlg.open) render(); });
}

render();
load();
setInterval(function(){ var a=document.activeElement&&document.activeElement.id; if (!document.hidden && !busy && !dlg.open && a!=='steps-in' && a!=='date-in') load(); }, 60000);
})();
</script>
</body>
